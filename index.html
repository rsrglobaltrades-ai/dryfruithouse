<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dry Fruit House — Premium dry fruits in Naihati</title>
<meta name="description" content="Premium dry fruits, gift packs and healthy snacks in Naihati, North 24 Parganas. See our rate list, find the shop, or order on WhatsApp." />
<meta name="theme-color" content="#0A2417" />
<meta property="og:title" content="Dry Fruit House — Naihati" />
<meta property="og:description" content="Nature's finest. Curated for life. Premium dry fruits, gift packs and healthy snacks." />
<meta property="og:type" content="website" />
<link rel="canonical" href="https://rsrglobaltrades-ai.github.io/dryfruithouse/" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --forest:#082115;
  --forest-2:#0E3122;
  --forest-3:#14412D;
  --gold:#C9A24A;
  --gold-lite:#EBD6A0;
  --cream:#F2EDE1;
  --muted:rgba(242,237,225,.62);
  --line:rgba(201,162,74,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(120% 60% at 50% 0%, #10402B 0%, transparent 60%),
    var(--forest);
  background-attachment:fixed;
  color:var(--cream);
  font-family:'Jost',system-ui,sans-serif;
  font-size:16px;font-weight:300;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{width:100%;max-width:600px;margin:0 auto;padding:0 20px}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:3px}

/* ── top bar ── */
.topbar{position:sticky;top:0;z-index:60;background:rgba(8,33,21,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .row{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.topbar .mark{font-family:'Cinzel',serif;font-weight:600;font-size:15px;letter-spacing:.14em;color:var(--gold-lite);text-transform:uppercase}
.wa{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(160deg,#D9B45E,#B8902F);color:#082115;
  font-family:'Jost',sans-serif;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  padding:10px 16px;border-radius:2px;text-decoration:none;white-space:nowrap}
.wa:hover{filter:brightness(1.07)}

/* ── hero ── */
.hero{padding:46px 0 40px;text-align:center;position:relative}
.frame{position:relative;padding:38px 22px 30px;border:1px solid var(--line)}
.frame::before,.frame::after{content:"";position:absolute;width:26px;height:26px;border:2px solid var(--gold)}
.frame::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.frame::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.crest-img{width:120px;height:auto;margin:0 auto 18px;display:block}
h1{font-family:'Cinzel',serif;font-weight:600;font-size:clamp(27px,7.6vw,40px);line-height:1.15;
  letter-spacing:.08em;text-transform:uppercase;color:var(--gold-lite)}
.tag{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;color:var(--muted);margin-top:6px}
.divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:20px auto 0;max-width:220px}
.divider i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.divider b{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);flex:none}
.place{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:18px}

.status{display:inline-flex;align-items:center;gap:9px;margin-top:18px;padding:8px 17px;border:1px solid var(--line);
  font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:400}
.lamp{width:8px;height:8px;border-radius:50%;background:#6b6b6b;flex:none}
.status.open{color:#7FD3A3;border-color:rgba(127,211,163,.38)}
.status.open .lamp{background:#7FD3A3;animation:pulse 2.6s infinite}
.status.shut{color:var(--muted)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(127,211,163,.55)}70%{box-shadow:0 0 0 8px rgba(127,211,163,0)}100%{box-shadow:0 0 0 0 rgba(127,211,163,0)}}

/* ── links ── */
.links{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:24px}
.link{display:flex;align-items:center;gap:11px;background:var(--forest-2);border:1px solid var(--line);
  padding:15px 16px;text-decoration:none;font-size:14.5px;font-weight:400;letter-spacing:.02em;
  transition:background .2s ease,border-color .2s ease,transform .2s ease}
.link:hover{background:var(--forest-3);border-color:var(--gold);transform:translateY(-2px)}
.link svg{width:18px;height:18px;flex:none;fill:var(--gold)}
.link.full{grid-column:1 / -1}
.link .sub{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em}

/* ── pillars ── */
.pillars{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 16px;margin:34px 0 0;
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);text-align:center}
.pillars span:not(:last-child)::after{content:"·";margin-left:16px;color:var(--line)}

/* ── sections ── */
.sec{padding:46px 0 0}
.sec-head{text-align:center}
.sec-head h2{font-family:'Cinzel',serif;font-weight:600;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-lite)}
.sec-head p{font-size:13px;color:var(--muted);margin-top:6px}
.sec .divider{margin-bottom:24px}

/* ── rate list ── */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
#search{flex:1 1 100%;background:var(--forest-2);border:1px solid var(--line);color:var(--cream);
  padding:12px 14px;font-family:'Jost',sans-serif;font-weight:300;font-size:15px;border-radius:2px}
#search::placeholder{color:rgba(242,237,225,.38)}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:2px;
  padding:9px 13px;font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;cursor:pointer;transition:all .18s ease}
.chip:hover{color:var(--gold-lite)}
.chip[aria-pressed="true"]{background:var(--gold);color:#082115;border-color:var(--gold)}

.group{margin-bottom:30px}
.group h3{font-family:'Cinzel',serif;font-size:13px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold);margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.item{display:flex;align-items:flex-end;gap:8px;padding:10px 0}
.item + .item{border-top:1px solid rgba(242,237,225,.07)}
.item .name{font-weight:400}
.item .note{display:block;font-size:12.5px;color:var(--muted)}
.item .dots{flex:1;border-bottom:1px dotted rgba(201,162,74,.4);margin-bottom:7px;min-width:12px}
.item .price{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:19px;color:var(--gold-lite);white-space:nowrap}
.item .badge{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);
  color:var(--gold);padding:2px 7px;margin-left:8px;vertical-align:2px}
.empty{color:var(--muted);padding:14px 0}
.ratenote{font-size:12.5px;color:var(--muted);text-align:center;margin-top:-8px;padding-bottom:6px}

/* ── find us ── */
.card{background:var(--forest-2);border:1px solid var(--line);padding:22px}
.addr{font-size:15px;color:rgba(242,237,225,.85);white-space:pre-line;line-height:1.7}
.card .divider{margin:18px auto}
.hours{width:100%;border-collapse:collapse;font-size:14px}
.hours td{padding:7px 0;border-bottom:1px solid rgba(242,237,225,.07)}
.hours tr:last-child td{border-bottom:0}
.hours td:last-child{text-align:right;color:var(--muted)}
.hours tr.today td,.hours tr.today td:last-child{color:var(--gold);font-weight:500}

footer{padding:42px 0 50px;text-align:center}
footer .crest-img{width:44px;margin:0 auto 12px}
footer .mark{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;display:block}
footer .fine{font-size:12px;color:rgba(242,237,225,.38);margin-top:10px}

@media (max-width:370px){.links{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap row">
    <span class="mark">Dry Fruit House</span>
    <a class="wa" id="topWa" href="#">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.4A10 10 0 1012 2zm5.8 14.2c-.2.7-1.2 1.3-2 1.4-.5.1-1.2.1-3.4-.8-2.9-1.2-4.7-4.1-4.9-4.3-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 .9-2.2.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.5c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.2.1.4.1.6-.1l.7-.9c.2-.2.4-.2.6-.1l2 .9c.2.1.4.2.4.3.1.2.1.6-.1 1.1z"/></svg>
      Order
    </a>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <div class="frame">
      <img class="crest-img" src="logo.jpg" alt="Dry Fruit House — Nature's finest, curated for life" />
      <div class="divider"><i></i><b></b><i></i></div>
      <div class="place" id="place"></div>
      <div class="status shut" id="status"><span class="lamp"></span><span id="statusText">Checking…</span></div>
    </div>

    <nav class="links" id="links" aria-label="Contact and location links"></nav>

    <div class="pillars" id="pillars"></div>
  </section>

  <section class="sec" id="rates">
    <div class="sec-head">
      <h2>Rate list</h2>
      <p id="itemCount"></p>
    </div>
    <div class="divider"><i></i><b></b><i></i></div>
    <div class="tools"><input id="search" type="search" placeholder="Search almonds, kaju, anjeer…" aria-label="Search the rate list" /></div>
    <div class="tools" id="chips" role="group" aria-label="Filter by category"></div>
    <p class="ratenote" id="ratenote"></p>
    <div id="catalogBody"></div>
  </section>

  <section class="sec">
    <div class="sec-head"><h2>Visit the shop</h2></div>
    <div class="divider"><i></i><b></b><i></i></div>
    <div class="card">
      <div class="addr" id="addr"></div>
      <div class="divider"><i></i><b></b><i></i></div>
      <table class="hours"><tbody id="hoursBody"></tbody></table>
    </div>
  </section>

</main>

<footer class="wrap">
  <img class="crest-img" style="width:52px;opacity:.85" src="logo.jpg" alt="" />
  <span class="mark">Dry Fruit House</span>
  <p class="fine" id="footLine"></p>
</footer>

<script>
/* ══════════════════════════════════════════════════════════
   EDIT ONLY THIS BLOCK.
   Phone format: 91 + 10 digits, no + and no spaces.
   Leave any link as "" and its button disappears by itself.
   ══════════════════════════════════════════════════════════ */
const CONFIG = {
  place: "Naihati · North 24 Parganas",

  phones: [
    { label: "7605844668", number: "917605844668" },
    { label: "7980729541", number: "917980729541" }
  ],
  whatsapp: "917605844668",
  whatsappMessage: "Hello Dry Fruit House! I'd like to ask about your stock and rates.",

  links: {
    maps:      "https://maps.app.goo.gl/mqYRgfmbcAT3HycL8?g_st=ic",
    instagram: "https://www.instagram.com/dryfruithouse_naihati?igsh=ZXd1bHBrZWY5djdw",
    facebook:  "https://www.facebook.com/share/1971tXrLtH/?mibextid=wwXIfr"
  },

  pillars: ["Premium dry fruits", "Gift packs", "Healthy snacks"],

  address: "Holding No. 32, Haridas Ghosh Road\nP.O. Naihati S.O. · P.S. Naihati\nWard No. 30, North 24 Parganas\nWest Bengal 743165",

  // 24-hour clock. null = closed that day.
  hours: {
    Mon: ["09:00","22:00"],
    Tue: ["09:00","22:00"],
    Wed: ["09:00","22:00"],
    Thu: null,
    Fri: ["09:00","22:00"],
    Sat: ["09:00","21:30"],
    Sun: ["09:00","21:30"]
  },

  rateNote: "Rates per 250 g unless mentioned. Market rates change — confirm on WhatsApp before ordering.",

  /* ⚠️ REPLACE THESE PRICES WITH YOUR ACTUAL RATES ⚠️ */
  catalog: [
    { category: "Premium dry fruits", items: [
      { name: "California almonds",      price: "₹—", note: "Badam · independent grade" },
      { name: "Cashew W240",             price: "₹—", note: "Kaju · whole, large", badge: "Bestseller" },
      { name: "Cashew W320",             price: "₹—", note: "Kaju · whole" },
      { name: "Pistachios",              price: "₹—", note: "Pista · roasted & salted" },
      { name: "Walnut kernels",          price: "₹—", note: "Akhrot · without shell" },
      { name: "Dried figs",              price: "₹—", note: "Anjeer" },
      { name: "Apricots",                price: "₹—", note: "Khumani · seedless" },
      { name: "Green raisins",           price: "₹—", note: "Kishmish · long" },
      { name: "Black raisins",           price: "₹—", note: "Seedless" },
      { name: "Dates",                   price: "₹—", note: "Khejur · soft, premium" }
    ]},
    { category: "Gift packs", items: [
      { name: "Assorted box · 4 items",  price: "₹—", note: "500 g total · ready to gift", badge: "Festive" },
      { name: "Assorted box · 6 items",  price: "₹—", note: "1 kg total" },
      { name: "Wedding hamper",          price: "₹—", note: "Made to order · bulk rates available" },
      { name: "Corporate order",         price: "On request", note: "Custom packing & branding" }
    ]},
    { category: "Healthy snacks", items: [
      { name: "Trail mix",               price: "₹—", note: "Nuts, seeds & berries" },
      { name: "Roasted makhana",         price: "₹—", note: "Fox nuts · lightly salted" },
      { name: "Mixed seeds",             price: "₹—", note: "Pumpkin, sunflower, flax, chia" },
      { name: "Dry fruit laddoo",        price: "₹—", note: "No added sugar" }
    ]}
  ]
};

/* ─────────── engine — no edits needed below ─────────── */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const waHref = CONFIG.whatsapp ? `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(CONFIG.whatsappMessage||"")}` : "";

$("place").textContent = CONFIG.place;
$("addr").textContent = CONFIG.address;
$("ratenote").textContent = CONFIG.rateNote;
$("footLine").textContent = `© ${new Date().getFullYear()} Dry Fruit House, Naihati · All rights reserved`;
$("pillars").innerHTML = CONFIG.pillars.map(p => `<span>${esc(p)}</span>`).join("");
if (waHref) $("topWa").href = waHref; else $("topWa").remove();

const ICONS = {
  maps:'<path d="M12 2a7 7 0 00-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 1112 6.5a2.5 2.5 0 010 5z"/>',
  instagram:'<path d="M12 2.2c3.2 0 3.6 0 4.9.1 1.2.1 1.8.3 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c-.1 1.2-.3 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2-.1-1.8-.3-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.9c.1-1.2.3-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4 1.3-.1 1.7-.1 4.8-.1zm0 3.8a6 6 0 106 6 6 6 0 00-6-6zm0 9.9A3.9 3.9 0 1115.9 12 3.9 3.9 0 0112 15.9zm6.2-10.3a1.4 1.4 0 11-1.4-1.4 1.4 1.4 0 011.4 1.4z"/>',
  facebook:'<path d="M14 8.5V7c0-.7.5-.9.8-.9h2V3.2h-2.7C11 3.2 10.4 5.4 10.4 6.8v1.7H8.5v3h1.9V21H14v-10.2h2.6l.3-3H14z"/>',
  phone:'<path d="M20 15.5a12.8 12.8 0 01-4-.6 1 1 0 00-1 .2l-1.7 1.7a15.2 15.2 0 01-6.6-6.6l1.7-1.7a1 1 0 00.2-1 12.8 12.8 0 01-.6-4 1 1 0 00-1-1H4a1 1 0 00-1 1A17 17 0 0020 21a1 1 0 001-1v-3.5a1 1 0 00-1-1z"/>',
  whatsapp:'<path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.4A10 10 0 1012 2zm5.8 14.2c-.2.7-1.2 1.3-2 1.4-.5.1-1.2.1-3.4-.8-2.9-1.2-4.7-4.1-4.9-4.3-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 .9-2.2.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.5c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.2.1.4.1.6-.1l.7-.9c.2-.2.4-.2.6-.1l2 .9c.2.1.4.2.4.3.1.2.1.6-.1 1.1z"/>'
};
const BUTTONS = [
  { key:"maps", label:"Get directions", sub:"Open in Google Maps", href:CONFIG.links.maps, full:true },
  { key:"instagram", label:"Instagram", href:CONFIG.links.instagram },
  { key:"facebook", label:"Facebook", href:CONFIG.links.facebook },
  { key:"whatsapp", label:"Order on WhatsApp", href:waHref },
  ...CONFIG.phones.map(p => ({ key:"phone", label:"Call", sub:p.label, href:`tel:+${p.number}` }))
];
$("links").innerHTML = BUTTONS.filter(b => b.href).map(b => `
  <a class="link${b.full ? " full" : ""}" href="${esc(b.href)}"${/^https/.test(b.href) ? ' target="_blank" rel="noopener"' : ""}>
    <svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[b.key]}</svg>
    <span>${esc(b.label)}${b.sub ? `<span class="sub">${esc(b.sub)}</span>` : ""}</span>
  </a>`).join("");

let activeCat = "All";
$("chips").innerHTML = ["All", ...CONFIG.catalog.map(g => g.category)]
  .map(c => `<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${c === "All"}">${esc(c)}</button>`).join("");

function renderCatalog(){
  const q = $("search").value.trim().toLowerCase();
  let shown = 0;
  const html = CONFIG.catalog
    .filter(g => activeCat === "All" || g.category === activeCat)
    .map(g => {
      const items = g.items.filter(i => !q || i.name.toLowerCase().includes(q) || (i.note||"").toLowerCase().includes(q));
      shown += items.length;
      if (!items.length) return "";
      return `<div class="group"><h3>${esc(g.category)}</h3>` + items.map(i => `
        <div class="item">
          <span class="name">${esc(i.name)}${i.badge ? `<span class="badge">${esc(i.badge)}</span>` : ""}
            ${i.note ? `<span class="note">${esc(i.note)}</span>` : ""}</span>
          <span class="dots"></span><span class="price">${esc(i.price)}</span>
        </div>`).join("") + `</div>`;
    }).join("");
  $("catalogBody").innerHTML = html || `<p class="empty">We don't list that yet — ask on WhatsApp and we'll check the stock for you.</p>`;
  $("itemCount").textContent = `${shown} item${shown === 1 ? "" : "s"} in stock`;
}
$("chips").addEventListener("click", e => {
  const btn = e.target.closest(".chip"); if (!btn) return;
  activeCat = btn.dataset.cat;
  [...$("chips").children].forEach(c => c.setAttribute("aria-pressed", c === btn));
  renderCatalog();
});
$("search").addEventListener("input", renderCatalog);
renderCatalog();

const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const ORDER = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const to12 = t => { const [h,m] = t.split(":").map(Number);
  return `${((h+11)%12)+1}:${String(m).padStart(2,"0")} ${h < 12 ? "am" : "pm"}`; };
const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const todayKey = DAYS[new Date().getDay()];
$("hoursBody").innerHTML = ORDER.map(d => {
  const h = CONFIG.hours[d];
  return `<tr class="${d === todayKey ? "today" : ""}"><td>${d}${d === todayKey ? " · today" : ""}</td>
    <td>${h ? `${to12(h[0])} – ${to12(h[1])}` : "Closed"}</td></tr>`;
}).join("");

function updateStatus(){
  const now = new Date(), mins = now.getHours()*60 + now.getMinutes();
  const h = CONFIG.hours[DAYS[now.getDay()]], box = $("status");
  if (h && mins >= toMin(h[0]) && mins < toMin(h[1])) {
    box.className = "status open";
    $("statusText").textContent = `Open now · till ${to12(h[1])}`;
  } else {
    box.className = "status shut";
    let next = null;
    for (let i = (h && mins < toMin(h[0])) ? 0 : 1; i <= 7; i++){
      const d = DAYS[(now.getDay()+i) % 7];
      if (CONFIG.hours[d]) { next = { when: i === 0 ? "today" : i === 1 ? "tomorrow" : d, t: CONFIG.hours[d][0] }; break; }
    }
    $("statusText").textContent = next ? `Closed · opens ${next.when} ${to12(next.t)}` : "Closed";
  }
}
updateStatus();
setInterval(updateStatus, 60000);
</script>
</body>
